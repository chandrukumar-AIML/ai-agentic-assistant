name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  backend-test:
    name: Backend — Tests + QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Run unit tests with coverage
        env:
          APP_ENV: test
          JWT_SECRET: ci-test-secret-32-chars-minimum-ok
          OPENAI_API_KEY: sk-test
          DEMO_MODE: "true"
        run: |
          pytest backend/tests/ -v --tb=short \
            --cov=backend --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Start backend for QA
        env:
          JWT_SECRET: ci-test-secret-32-chars-minimum-ok
          APP_ENV: development
          DEMO_MODE: "true"
        run: |
          uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          sleep 6
          curl -f http://localhost:8000/api/health

      - name: Run SM Agent QA (41 actions)
        env:
          JWT_SECRET: ci-test-secret-32-chars-minimum-ok
          APP_ENV: development
          DEMO_MODE: "true"
        run: python qa/qa_sm_full.py

      - name: Run CS Agent QA (42 actions)
        env:
          JWT_SECRET: ci-test-secret-32-chars-minimum-ok
          APP_ENV: development
          DEMO_MODE: "true"
        run: python qa/qa_cs_full.py

      - name: Run CA Agent QA (44 actions)
        env:
          JWT_SECRET: ci-test-secret-32-chars-minimum-ok
          APP_ENV: development
          DEMO_MODE: "true"
        run: python qa/qa_ca_full.py

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check backend/ --select E,W,F --ignore E501

  frontend:
    name: Frontend — Type Check + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build

  smoke-test:
    name: Smoke Test — Live Deploy
    runs-on: ubuntu-latest
    needs: [backend-test, lint, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Wait for Render auto-deploy
        run: sleep 90

      - name: Health check — backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://ai-agentic-backend-ywdx.onrender.com/api/health)
          echo "Health status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Smoke test — login endpoint
        run: |
          RESP=$(curl -s -X POST \
            https://ai-agentic-backend-ywdx.onrender.com/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@agentic.local","password":"admin123"}')
          echo "$RESP" | grep -q "access_token" || (echo "Login failed: $RESP" && exit 1)

      - name: Smoke test — social agent (DEMO_MODE)
        run: |
          TOKEN=$(curl -s -X POST \
            https://ai-agentic-backend-ywdx.onrender.com/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@agentic.local","password":"admin123"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://ai-agentic-backend-ywdx.onrender.com/api/verticals/social/action \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"action":"generate","platform":"linkedin","payload":{"topic":"AI for SMBs"},"language":"en"}')
          echo "Social agent status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
