# .github/workflows/eval_gate.yml
name: Eval Gate — Block Deploy if Quality Drops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval-gate:
    name: Agent Evaluation Gate
    runs-on: ubuntu-latest
    needs: test   # run after unit tests pass

    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create eval .env
        run: |
          cat > .env << 'EOF'
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=test-password
          REDIS_URL=redis://localhost:6379
          OLLAMA_BASE_URL=http://localhost:11434
          JWT_SECRET=eval-secret-key-32-chars-minimum-ci
          FAISS_INDEX_PATH=./data/faiss_index
          CHROMA_HOST=localhost
          CHROMA_PORT=8001
          MLFLOW_TRACKING_URI=./data/mlflow_runs
          POSTGRES_HOST=localhost
          POSTGRES_DB=agentic_v2
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          APP_ENV=test
          EOF

      - name: Run eval gate (20 samples)
        id: eval
        run: |
          python -c "
          import asyncio, json, sys
          from backend.evaluation.eval_runner import run_evaluation

          async def main():
              report = await run_evaluation(limit=20)
              print(json.dumps(report, indent=2))
              gate = report.get('gate', {})
              passed = gate.get('passed', False)
              tcr    = report.get('metrics', {}).get('tcr', 0)
              comp   = report.get('metrics', {}).get('composite', 0)

              print(f'TCR: {tcr:.1%}')
              print(f'Composite: {comp:.1%}')
              print(f'Gate: {\"PASS\" if passed else \"FAIL\"}')

              if not passed:
                  print('EVAL_GATE_FAILED=true')
                  sys.exit(1)
              print('EVAL_GATE_FAILED=false')

          asyncio.run(main())
          "

      - name: Post eval summary
        if: always()
        run: |
          echo "## 🧪 Eval Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "See logs above for full breakdown" >> $GITHUB_STEP_SUMMARY

      - name: Block deploy on eval failure
        if: failure()
        run: |
          echo "❌ Eval gate FAILED — deployment blocked"
          echo "TCR or composite score below threshold"
          echo "Fix the regression before merging to main"
          exit 1