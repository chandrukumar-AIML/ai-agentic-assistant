# .github/workflows/deploy.yml — FINAL VERSION
name: V2 Full CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── 1. Unit tests ─────────────────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio pytest-cov httpx
      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          OPENAI_API_KEY=sk-test-placeholder-ci
          LANGCHAIN_API_KEY=ls__test-placeholder-ci
          TAVILY_API_KEY=tvly-test-placeholder-ci
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=test-password
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=test-secret-key-32-chars-minimum-ci
          CHROMA_HOST=localhost
          CHROMA_PORT=8001
          POSTGRES_HOST=localhost
          POSTGRES_DB=agentic_v2
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          APP_ENV=test
          CORS_ORIGINS=["http://localhost:5173"]
          EOF
      - run: |
          pytest backend/tests/ -v \
            --ignore=backend/tests/test_integration.py \
            --ignore=backend/tests/test_load.py \
            --tb=short --cov=backend --cov-report=xml -x
      - uses: codecov/codecov-action@v4
        if: always()
        with: { file: coverage.xml, fail_ci_if_error: false }

  # ── 2. Eval gate ──────────────────────────────────────────────────────────
  eval-gate:
    name: Eval Gate (TCR ≥ 80%)
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r backend/requirements.txt
      - name: Create eval .env
        run: |
          cat > .env << 'EOF'
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          JWT_SECRET=eval-secret-32-chars-minimum
          REDIS_URL=redis://localhost:6379
          CHROMA_HOST=localhost
          CHROMA_PORT=8001
          POSTGRES_HOST=localhost
          POSTGRES_DB=agentic_v2
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          APP_ENV=test
          CORS_ORIGINS=["http://localhost:5173"]
          EOF
      - name: Run eval suite (15 samples)
        run: |
          python -c "
          import asyncio, sys
          from backend.evaluation.eval_runner import run_evaluation
          async def main():
              report = await run_evaluation(limit=15)
              tcr    = report['metrics']['tcr']
              comp   = report['metrics']['composite']
              passed = report['gate']['passed']
              print(f'TCR: {tcr:.1%} | Composite: {comp:.1%} | Gate: {\"PASS\" if passed else \"FAIL\"}')
              if not passed:
                  sys.exit(1)
          asyncio.run(main())
          "

  # ── 3. Build Docker images ────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build ./backend -t aaa-backend:${{ github.sha }} --target runtime
      - name: Build frontend
        run: docker build ./frontend -t aaa-frontend:${{ github.sha }}
      - name: Build Playwright service
        run: docker build ./playwright-service -t aaa-playwright:${{ github.sha }}

  # ── 4. Integration tests ─────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          cp .env.example .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }}" >> .env
          echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> .env
      - name: Start stack
        run: docker compose up -d --wait --timeout 120
      - name: Run integration tests
        run: docker compose exec -T backend pytest backend/tests/test_integration.py -v --tb=short
      - name: Capture logs on failure
        if: failure()
        run: docker compose logs backend > backend_logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: backend-logs, path: backend_logs.txt }
      - name: Tear down
        if: always()
        run: docker compose down

  # ── 5. Deploy to Railway ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [eval-gate, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - name: Deploy backend
        env: { RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }} }
        run: railway up --service backend --detach --no-input
      - name: Deploy frontend
        env: { RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }} }
        run: railway up --service frontend --detach --no-input
      - name: Health gate (wait for prod to be healthy)
        env:
          BACKEND_PUBLIC_URL: ${{ secrets.BACKEND_PUBLIC_URL }}
        run: |
          for i in {1..30}; do
            STATUS=$(curl -sf "$BACKEND_PUBLIC_URL/api/health" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null \
              || echo "unreachable")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "ok" ]; then echo "Healthy!"; exit 0; fi
            sleep 10
          done
          echo "Health gate timed out"; exit 1
      - name: Start canary (10% traffic → new version)
        env:
          BACKEND_PUBLIC_URL: ${{ secrets.BACKEND_PUBLIC_URL }}
          RAILWAY_TOKEN:      ${{ secrets.RAILWAY_TOKEN }}
        run: |
          curl -sf -X POST \
            "$BACKEND_PUBLIC_URL/api/mlops/canary/start" \
            -H "Authorization: Bearer ${{ secrets.PROD_API_KEY }}" \
            -G --data "model_name=gpt-4o" \
               --data "traffic_pct=0.1" \
               --data "min_queries=50" \
            || echo "Canary start failed (non-fatal)"
      - name: Post deployment summary
        if: success()
        run: |
          echo "## ✅ V2 Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | ${{ secrets.BACKEND_PUBLIC_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ secrets.FRONTEND_PUBLIC_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit   | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phases   | A-O complete |" >> $GITHUB_STEP_SUMMARY