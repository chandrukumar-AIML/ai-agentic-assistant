# backend/guardrails/configs/medical.yaml
# Stricter config for medical domain

models:
  - type: main
    engine: openai
    model: gpt-4o

rails:
  input:
    flows:
      - check injection
      - check pii
      - check medical dangerous request

  output:
    flows:
      - add medical disclaimer
      - check pii in output
      - check dangerous medical advice

config:
  block_injection: true
  mask_pii: true
  injection_block_threshold: 0.8
  # Additional medical-specific rules
  require_disclaimer: true
  disclaimer_text: >
    ⚠️ This information is for educational purposes only.
    Always consult a qualified healthcare professional for medical advice.
  block_topics:
    - specific drug dosages for self-medication
    - instructions to stop prescribed medication
    - diagnose serious conditions without professional evaluation
  audit_logging: true