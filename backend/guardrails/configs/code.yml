# backend/guardrails/configs/code.yaml
# Code/developer domain — more permissive on technical content

models:
  - type: main
    engine: openai
    model: gpt-4o

rails:
  input:
    flows:
      - check injection
      - check malware request

  output:
    flows:
      - check malware in output

config:
  block_injection: true
  mask_pii: true
  injection_block_threshold: 0.95   # higher threshold — dev queries look like injections
  # Code-specific blocks
  block_topics:
    - ransomware creation
    - keylogger development
    - network intrusion tools
    - credential stealing code
  # Allow security research framing
  allow_security_research: true
  audit_logging: true