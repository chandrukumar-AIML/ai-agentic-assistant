# backend/guardrails/configs/general.yaml
# NeMo Guardrails config for general use domain

models:
  - type: main
    engine: openai
    model: gpt-4o

rails:
  input:
    flows:
      - check injection
      - check pii
      - check toxic input

  output:
    flows:
      - check toxic output
      - check pii in output

prompts:
  - task: check_input_toxicity
    content: |
      Classify the user message as SAFE or UNSAFE.
      UNSAFE includes: hate speech, threats, harassment, self-harm promotion.
      Be strict but not over-restrictive — legitimate questions about sensitive topics are SAFE.
      Respond with ONLY: SAFE or UNSAFE

      Message: {{ user_input }}

  - task: check_output_toxicity
    content: |
      Classify this AI response as SAFE or UNSAFE.
      UNSAFE: contains harmful instructions, promotes violence, reveals dangerous information.
      Respond with ONLY: SAFE or UNSAFE

      Response: {{ bot_response }}

config:
  # Maximum input length before we force a check
  max_input_length: 10000
  # Block injection attempts
  block_injection: true
  # Mask PII before sending to agent
  mask_pii: true
  # Minimum confidence to block (0-1)
  injection_block_threshold: 0.9
  # Log all guardrail events
  audit_logging: true
  # Safe topics (always allowed even if flagged as off-topic)
  always_allow_topics:
    - general knowledge
    - coding
    - mathematics
    - science
    - writing assistance