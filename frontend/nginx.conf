server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Allow large file uploads (PDFs up to 50MB + headroom)
    client_max_body_size 55M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Aggressive caching for hashed assets, no-cache for index.html
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    0;
    }

    # API proxy — covers /api/* (all backend routes)
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # MCP JSON-RPC proxy (no /api prefix)
    location /mcp {
        proxy_pass         http://backend:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # A2A agent card (no /api prefix)
    location /.well-known/ {
        proxy_pass         http://backend:8000/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    # WebSocket proxy — buffering must be off for token-by-token streaming
    location /ws {
        proxy_pass          http://backend:8000/ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        # Disable buffering so tokens stream immediately to browser
        proxy_buffering     off;
        proxy_cache         off;
    }

    # Prometheus metrics — restrict to private networks only
    location /metrics {
        proxy_pass http://backend:8000/metrics;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}